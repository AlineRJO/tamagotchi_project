<div class="row d-flex justify-content-between align-items-center mb-2">
  <span class="col-md-6 fw-semibold">{{progressLabel()}}</span>
  <span class="col-md-1 badge bg-secondary">{{initialValue()}}%</span>
</div>
<div class="row">
  <div class="progress col">
    <div
      class="progress-bar progress-bar-striped progress-bar-animated"
      role="progressbar"
      [style.width.%]="initialValue()"
      [ngClass]="updateProgressClass()"
      [attr.aria-valuenow]="initialValue()"
      aria-valuemin="0"
      aria-valuemax="100"
    >
      {{ initialValue() }}%
    </div>
  </div>
</div>
